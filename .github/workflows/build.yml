name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 (best effort)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set +e
          xcodebuild -project RevisionTracker.xcodeproj -scheme RevisionTracker -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/RevisionTracker.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "error:|warning:|\*\* (BUILD|ARCHIVE)" build/xcodebuild.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild exited with status $status"
            exit "$status"
          fi

      - name: Check the app bundle
        run: |
          APP=build/RevisionTracker.xcarchive/Products/Applications/RevisionTracker.app
          test -d "$APP"
          test -f "$APP/index.html"            || { echo "::error::index.html not bundled"; exit 1; }
          test -f "$APP/Assets.car"            || { echo "::error::asset catalog not compiled"; exit 1; }
          test -x "$APP/RevisionTracker"       || { echo "::error::executable missing"; exit 1; }
          cmp index.html "$APP/index.html"     || { echo "::error::bundled index.html differs from repo"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleIcon|MinimumOSVersion|UIFileSharingEnabled"
          plutil -p "$APP/Info.plist" | grep -q "com.youssoufdiallo.revisiontracker" || { echo "::error::wrong bundle id"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -q "CFBundleIcons" || { echo "::error::app icon not registered"; exit 1; }
          lipo -info "$APP/RevisionTracker"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/RevisionTracker.xcarchive/Products/Applications/RevisionTracker.app Payload/
          zip -qry RevisionTracker.ipa Payload
          unzip -l RevisionTracker.ipa | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: RevisionTracker.ipa
          path: RevisionTracker.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
